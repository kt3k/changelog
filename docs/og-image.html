<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@500;700;800&display=swap"
      rel="stylesheet"
    >
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: "Mulish", sans-serif;
        background: #ffffff;
        color: #333333;
        padding: 88px 100px;
      }
      .masthead {
        width: fit-content;
      }
      h1 {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .underline {
        margin-top: 20px;
        width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #ff572f;
      }
      .tagline {
        margin-top: 28px;
        font-size: 29px;
        font-weight: 500;
        line-height: 1.45;
        color: #6b6b6b;
      }
      .strips {
        margin-top: 56px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .cells {
        display: flex;
        gap: 7px;
      }
      .c {
        width: 26px;
        height: 26px;
        border-radius: 5px;
        flex: none;
      }
      .c0 {
        background: #ebedf0;
      }
      .c1 {
        background: #9be9a8;
      }
      .c2 {
        background: #40c463;
      }
      .c3 {
        background: #216e39;
      }
    </style>
  </head>
  <body>
    <div class="masthead">
      <h1>Changelog</h1>
      <div class="underline"></div>
    </div>
    <p class="tagline">
      Daily, weekly, and monthly summaries of<br>the main branches of selected
      git repos.
    </p>
    <div class="strips" id="strips"></div>
    <script>
      var rows = [
        [
          2,
          3,
          1,
          0,
          2,
          2,
          3,
          1,
          0,
          1,
          2,
          3,
          2,
          1,
          0,
          2,
          3,
          3,
          1,
          2,
          0,
          1,
          2,
          3,
          2,
          1,
          3,
          2,
          0,
          2,
        ],
        [
          3,
          2,
          2,
          1,
          3,
          0,
          1,
          2,
          3,
          2,
          1,
          0,
          2,
          3,
          1,
          2,
          2,
          0,
          3,
          1,
          2,
          2,
          1,
          3,
          0,
          2,
          3,
          1,
          2,
          3,
        ],
        [
          1,
          2,
          0,
          3,
          2,
          1,
          2,
          0,
          1,
          3,
          2,
          2,
          0,
          1,
          2,
          3,
          1,
          2,
          2,
          0,
          3,
          2,
          1,
          2,
          3,
          1,
          0,
          2,
          2,
          1,
        ],
      ];
      var el = document.getElementById("strips");
      rows.forEach(function (r) {
        var cells = document.createElement("div");
        cells.className = "cells";
        r.forEach(function (v) {
          var c = document.createElement("div");
          c.className = "c c" + v;
          cells.appendChild(c);
        });
        el.appendChild(cells);
      });
    </script>
  </body>
</html>
